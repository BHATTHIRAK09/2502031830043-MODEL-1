<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Rainbow Background Loop</title>
    <style>
        /* --- General Reset & Layout --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* CRITICAL: Smooth cross-fade transition behavior for the background color */
            background-color: #e53e3e; 
            transition: background-color 0.8s ease; 
            overflow: hidden;
        }

        /* --- Translucent Glass Display Panel --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .glass-panel h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .glass-panel p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        /* --- Live Color Hex Badge Indicator --- */
        .color-badge {
            display: inline-block;
            margin-top: 25px;
            background-color: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 30px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body id="mybody">

    <div class="glass-panel">
        <h1>Interval Color Loop</h1>
        <p>The system background color updates dynamically using a timed array sequence ring wheel counter.</p>
        
        <div id="hexValue" class="color-badge">#E53E3E</div>
    </div>

    <script>
        // Array cluster housing our custom modern flat pastel color selections
        var colors = ["#e53e3e", "#dd6b20", "#d69e2e", "#38a169", "#319795", "#3182ce", "#805ad5", "#d53f8c"];
        
        var mybody = document.getElementById("mybody");
        var hexValue = document.getElementById("hexValue");
        var i = 0;

        // --- Setting up the recurring structural interval engine loop ---
        setInterval(function() {
            
            // 1. Shift pointer to point to the next structural index location
            i = (i + 1) % colors.length; 

            // 2. Fetch color string from array position and write it directly to the element body style
            var currentHex = colors[i];
            mybody.style.backgroundColor = currentHex;

            // 3. Update the text label overlay badge to show the current hex code string value
            hexValue.innerHTML = currentHex.toUpperCase();
            
        }, 1000); // Loops continuously every 1000 milliseconds (exactly 1 second)
    </script>
</body>
</html>
