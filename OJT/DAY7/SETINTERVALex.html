<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript setInterval Digital Clock</title>
    <style>
        /* --- General Page Reset & Themes --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #090d16;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Elegant Clock Card Container --- */
        .clock-card {
            background: linear-gradient(145deg, #111827, #1f2937);
            border: 1px solid #374151;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .clock-card h2 {
            color: #9ca3af;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* --- Large Digital Timer Interface --- */
        .time-display {
            font-family: monospace;
            font-size: 48px;
            font-weight: bold;
            color: #06b6d4; /* Neon Cyan color */
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            background-color: #030712;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            display: inline-block;
            letter-spacing: 2px;
        }

        /* --- Live Pulse Indicator Dot --- */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981; /* Green */
            border-radius: 50%;
            transition: opacity 0.2s ease;
        }

        /* This class will toggle on and off via setInterval */
        .pulse-dot.dim {
            opacity: 0.3;
        }

        .status-text {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <h2>Live System Clock</h2>
        
        <div id="clockDisplay" class="time-display">00:00:00 AM</div>
        
        <div class="status-container">
            <div id="liveDot" class="pulse-dot"></div>
            <span class="status-text">setInterval updating live every 1s</span>
        </div>
    </div>

    <script>
        // Create an initial call so the clock doesn't show 00:00:00 on page load
        updateClock();

        // --- Setting up the JavaScript setInterval Loop ---
        // Syntax: setInterval(function, delay_in_milliseconds)
        setInterval(function() {
            
            // This entire code block inside runs repeatedly non-stop 
            // exactly every 1000 milliseconds (which is equal to 1 second)
            updateClock();
            
        }, 1000);

        function updateClock() {
            var clockDisplay = document.getElementById("clockDisplay");
            var liveDot = document.getElementById("liveDot");

            // 1. Fetch current live date system timestamp instance
            var now = new Date();

            // 2. Format it smoothly into standard readable local time (HH:MM:SS AM/PM)
            var timeString = now.toLocaleTimeString();

            // 3. Inject the formatted time string into the display box
            clockDisplay.innerHTML = timeString;

            // 4. Toggle the pulse dot class to create a live blinking heart-beat effect
            liveDot.classList.toggle("dim");
        }
    </script>

</body>
</html>
