<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Date Display on Keypress</title>
    <style>
        /* --- General Reset & Styling --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Elegant Glassmorphism Card --- */
        .card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            color: #4a5568;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* --- Modern Text Input --- */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            color: #2d3748;
            background-color: #f7fafc;
        }

        /* Input field glow on focus */
        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background-color: #ffffff;
        }

        /* --- Dynamic Date Display Box --- */
        .date-box {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f6f8ff 0%, #f1f3f9 100%);
            border-radius: 12px;
            border-left: 5px solid #667eea;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Class added via JS to show the date box smoothly */
        .date-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .date-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .date-value {
            font-size: 16px;
            font-weight: 600;
            color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Date Picker</h2>
        <p>Click inside the box and press any key to display current date:</p>
        
        <input type="text" id="key" placeholder="Type anything here..." autocomplete="off">
        
        <div id="dateContainer" class="date-box">
            <div class="date-label">Current Timestamp</div>
            <div id="dateValue" class="date-value">-</div>
        </div>
    </div>

    <script>
        var keyInput = document.getElementById("key");
        var dateContainer = document.getElementById("dateContainer");
        var dateValue = document.getElementById("dateValue");

        // Listen for keyboard input triggers
        keyInput.addEventListener("keydown", function() {
            // 1. Capture the fresh live Date instance
            var currentDateTime = new Date();
            
            // 2. Format it into a highly readable localized string format
            var formattedDate = currentDateTime.toLocaleString('en-IN', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });

            // 3. Insert text into the output block
            dateValue.innerHTML = formattedDate;

            // 4. Fire the smooth fade-in CSS transition effect
            dateContainer.classList.add("show");
        });
    </script>

</body>
</html>
