<!DOCTYPE html>
<html lang="en">
<head>
    <style>
       
        .main-container {
            border: 5px solid black;
            padding: 10px;
            background-color: #f4f4f4;
        }

        .left-box {
            float: left;
            width: 150px;
            height: 100px;
            background-color: red;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 100px;
            margin-right: 20px;
        }

    
        .right-box {
            float: right;
            width: 150px;
            height: 100px;
            background-color: blue;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 100px;
            margin-left: 20px;
        }

      
        .clear-fix {
            clear: both;
        }
    </style>
</head>
<body>

    <h2>Float Property - Real Example</h2>

    <div class="main-container">
        
        <div class="left-box">LEFT BOX</div>
        <div class="right-box">RIGHT BOX</div>

        <div class="clear-fix"></div>

    </div>

   

</body>
</html>
