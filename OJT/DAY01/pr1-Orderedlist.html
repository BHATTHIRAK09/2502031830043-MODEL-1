<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orderedlist</title>
</head>
<body>
    <ol>
        <li>Item one</li>
        <li>Item two</li>
        <ol type="I">
            <li> sublist item one</li>
            <li> sublist item two</li>
            <ol type="i">
            <li> sublist item one</li>
            <li> sublist item two</li>
            </ol>
        </ol>
    </ol>
</body>
</html>
